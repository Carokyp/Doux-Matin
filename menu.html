    <!-- Prevent navbar toggler from staying focused (removes outline after click) -->
    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {
                const toggler = document
                    .querySelector(
                        ".navbar-toggler");

                toggler.addEventListener(
                    "click",
                    function() {
                        //Wait briefly for the collapse to run, then remove focus from the button
                        setTimeout(
                            () => {
                                toggler
                                    .blur();
                            },
                            200); // Delay ensures Bootstrap’s collapse finishes before removing focus from the toggler
                    });
            });
    </script>

    <!--
    JavaScript adds 'active' class to clicked nav link and removes it from others.
    This highlights the clicked menu and contact item with an underline
    -->
    <script>
        document.querySelectorAll(
            '.navbar .nav-link').forEach(
            link => {
                link.addEventListener(
                    'click', e => {
                        // Remove active class from all links
                        document
                            .querySelectorAll(
                                '.navbar .nav-link'
                            )
                            .forEach(
                                nav =>
                                nav
                                .classList
                                .remove(
                                    'active'
                                ));
                        // Add active class to the clicked link
                        e.currentTarget
                            .classList
                            .add(
                                'active'
                            );
                    });
            });
    </script>
